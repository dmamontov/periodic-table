<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('periodic-table-theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'auto' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.dataset.theme = 'dark'
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Интерактивная периодическая таблица с коллекцией элементов" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://periodic.mamontov.tech/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Мамонтов — коллекция элементов" />
    <meta property="og:title" content="Мамонтов — коллекция элементов" />
    <meta
      property="og:description"
      content="Интерактивная периодическая таблица с коллекцией элементов"
    />
    <meta property="og:url" content="https://periodic.mamontov.tech/" />
    <meta property="og:image" content="https://periodic.mamontov.tech/pwa-512.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Мамонтов — коллекция элементов" />
    <meta
      name="twitter:description"
      content="Интерактивная периодическая таблица с коллекцией элементов"
    />
    <meta name="twitter:image" content="https://periodic.mamontov.tech/pwa-512.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Элементы" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone
          if (standalone) document.documentElement.classList.add('pwa-standalone')
        } catch (e) {}
      })()
    </script>
    <title>Мамонтов — коллекция элементов</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
